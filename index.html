async function afterLogin(user){
  sbUser=user; setSync(false,"Connexion…");
  const uid=user.id;
  try{
    const [pr,me,se,dy]=await Promise.all([
      sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
      sb.from("user_meta").select("data").eq("user_id",uid).maybeSingle(),
      sb.from("sessions").select("data").eq("user_id",uid),
      sb.from("nutrition_days").select("day,items").eq("user_id",uid).order("day",{ascending:false}).limit(120)
    ]);
    sbProfile=pr.data;
    if(!sbProfile){ const ps=((user.user_metadata&&user.user_metadata.pseudo)||S.settings.name||"Athlète").slice(0,20); await sb.from("profiles").insert({id:uid,pseudo:ps.length<2?ps+"_":ps}); sbProfile={id:uid,pseudo:ps}; }
    if(!S.settings.name) S.settings.name=sbProfile.pseudo;
    const d=me.data&&me.data.data&&Object.keys(me.data.data).length?me.data.data:null;
    const remote=(se.data||[]).map(x=>x.data).filter(Boolean);
    const days={}; (dy.data||[]).forEach(x=>days[x.day]=x.items||[]);
    const cur=JSON.parse(JSON.stringify(S));
    const ids=new Set(remote.map(x=>x.id)), extra=(cur.sessions||[]).filter(x=>!ids.has(x.id));
    const sessions=[...remote,...extra].sort((a,b)=>b.date-a.date);
    if(d){
      const localNewer=(cur.u||0)>(d.u||0);
      const wmap={}; const dayK=w=>new Date(w.date).toDateString();
      (localNewer?[...(d.weights||[]),...(cur.weights||[])]:[...(cur.weights||[]),...(d.weights||[])]).forEach(w=>{ if(w&&num(w.kg)>0) wmap[dayK(w)]=w; });
      const weights=Object.values(wmap).sort((a,b)=>a.date-b.date);
      if(localNewer) mergeState(Object.assign({},cur,{sessions,weights,days:Object.assign({},days,cur.days||{})}));
      else mergeState(Object.assign({},d,{sessions,weights,profile:Object.assign({},cur.profile,d.profile),days:Object.assign({},cur.days||{},days)}));
    } else mergeState(Object.assign({},cur,{sessions,days:Object.assign({},days,cur.days||{})}));
    store="sb";
    S.settings.offline=false;
    // on envoie ce qui n'est pas encore en ligne
    for(const x of extra) await sb.from("sessions").upsert({id:x.id,user_id:uid,data:x,date:new Date(x.date).toISOString()});
    for(const k of Object.keys(S.days)) if(!days[k]&&(S.days[k]||[]).length) await sb.from("nutrition_days").upsert({user_id:uid,day:k,items:S.days[k]});
    await queueWrite("meta",sbAdapter(v=>sb.from("user_meta").upsert({user_id:uid,data:v,updated_at:new Date().toISOString()})),metaData);
    setSync(true); LS.save(); applyTheme(); publishStats();
    if(tab==="auth"){ tab="home"; animateNext=true; }
    render();
  }catch(e){ setSync(false,"Erreur synchro"); }
}
function sbSaveMeta(delay){ return queueWrite("meta",sbAdapter(v=>sb.from("user_meta").upsert({user_id:sbUser.id,data:v,updated_at:new Date().toISOString()})),metaData,delay); }
function sbSaveDay(k){ queueWrite("day:"+k,sbAdapter(v=>sb.from("nutrition_days").upsert({user_id:sbUser.id,day:k,items:v.items})),()=>({items:S.days[k]||[]}),500); }
async function sbSaveSession(s){ try{ const {error}=await sb.from("sessions").upsert({id:s.id,user_id:sbUser.id,data:s,date:new Date(s.date).toISOString()}); if(error) throw error; publishStatsSoon(); }catch(e){ setSync(false,"Erreur synchro"); } }
async function sbDeleteSession(id){ try{ await sb.from("sessions").delete().eq("id",id); publishStatsSoon(); }catch(e){} }
function publishStatsSoon(){ if(store!=="sb") return; clearTimeout(statsT); statsT=setTimeout(publishStats,2500); }
function weekStart(){ const n=new Date(), dow=(n.getDay()+6)%7; return new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow).getTime(); }
async function publishStats(){
  if(store!=="sb"||!sbUser) return;
  try{
    const X=computeXP(), lv=levelOf(X.total), r=allRanks(), g=globalRank(r), mon=weekStart();
    const monK=todayKey(new Date(mon));
    const xpWeek=S.sessions.filter(s=>s.date>=mon).reduce((a,s)=>a+((X.per[s.id]||{}).gain||0),0)+Object.entries(X.stepGain||{}).filter(([k])=>k>=monK).reduce((a,[,g])=>a+g,0);
    const ranks={}; CATS.forEach(c=>ranks[c.id]=r[c.id].step);
    await sb.from("public_stats").upsert({user_id:sbUser.id,pseudo:sbProfile.pseudo,level:lv.L,xp_total:X.total,xp_week:xpWeek,week_key:todayKey(new Date(mon)),
      gauge_pts:Math.round(todayScore().sc),gauge_day:todayKey(),global_step:g.step,ranks,sessions_30:S.sessions.filter(s=>s.date>Date.now()-30*864e5).length,
      streak:streakWeeks(),rank_theme:S.settings.rankTheme||"classic",updated_at:new Date().toISOString()});
  }catch(e){}
}

/* ---------- Écran de connexion ---------- */
function viewAuth(){
  const su=authMode==="signup";
  return `<div style="min-height:82vh;display:flex;flex-direction:column;justify-content:center;padding-top:10px">
    <div style="text-align:center;margin-bottom:22px"><div style="font-size:60px;animation:bob 2.6s ease-in-out infinite">🏋️</div><h1 style="font-size:34px;margin-top:6px">Suivi Muscu</h1><div class="mut">Tes séances, tes rangs… et tes potes.</div></div>
    <div class="card">
      <div class="seg" style="margin-bottom:14px"><button class="${su?"on":""}" onclick="authMode='signup';render()">Créer un compte</button><button class="${su?"":"on"}" onclick="authMode='login';render()">Se connecter</button></div>
      ${su?`<label class="l">Pseudo (visible par tes potes)</label><input id="auP" class="field" maxlength="20" placeholder="ex. Kevin" value="${esc(S.settings.name||"")}">`:""}
      <label class="l">E-mail</label><input id="auE" class="field" type="email" autocomplete="email" placeholder="toi@mail.com">
      <label class="l">Mot de passe</label><input id="auW" class="field" type="password" autocomplete="${su?"new-password":"current-password"}" placeholder="${su?"6 caractères minimum":"••••••"}" onkeydown="if(event.key==='Enter')doAuth()">
      <button class="btn" id="auBtn" onclick="doAuth()">${su?"Créer mon compte":"Se connecter"}</button>
      <div id="auErr" class="small" style="color:var(--bad);margin-top:10px;text-align:center"></div>
      ${su?"":`<div style="text-align:center;margin-top:10px"><a class="small" style="color:var(--acc);cursor:pointer" onclick="forgotPw()">Mot de passe oublié ?</a></div>`}
    </div>
    <button class="btn sec" onclick="useOffline()">Continuer sans compte</button>
    <div class="note" style="text-align:center">Sans compte, tes données restent sur ce téléphone et tu n'as pas accès aux classements.</div>
  </div>`;
}
function authErrFr(m){ m=String(m||""); return /Invalid login/i.test(m)?"E-mail ou mot de passe incorrect.":/already registered|already been registered/i.test(m)?"Un compte existe déjà avec cet e-mail. Connecte-toi.":/at least 6|Password should/i.test(m)?"Le mot de passe doit faire au moins 6 caractères.":/valid email|invalid.*email/i.test(m)?"Adresse e-mail invalide.":/rate limit|too many/i.test(m)?"Trop d'essais, réessaie dans un moment.":/Email not confirmed/i.test(m)?"Confirme d'abord ton e-mail (lien reçu par mail).":"Erreur : "+m; }
async function doAuth(){
  const e=($("#auE").value||"").trim(), w=$("#auW").value||"", err=$("#auErr"), btn=$("#auBtn");
  if(!e||!w){ err.textContent="Remplis l'e-mail et le mot de passe."; return; }
  btn.disabled=true; btn.textContent="…"; err.textContent="";
  try{
    if(authMode==="signup"){
      const ps=($("#auP").value||"").trim();
      if(ps.length<2){ err.textContent="Choisis un pseudo (2 caractères minimum)."; return; }
      const {data,error}=await sb.auth.signUp({email:e,password:w,options:{data:{pseudo:ps},emailRedirectTo:location.origin+location.pathname}});
      if(error) throw error;
      S.settings.name=ps;
      if(!data.session){ err.style.color="var(--txt)"; err.textContent="📧 Compte créé ! Clique sur le lien reçu par mail, puis connecte-toi."; authMode="login"; return; }
      await afterLogin(data.user); toast("🎉 Bienvenue "+ps+" !"); confetti(60);
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email:e,password:w});
      if(error) throw error;
      await afterLogin(data.user); toast("👋 Content de te revoir !");
    }
  }catch(x){ err.textContent=authErrFr(x.message); }
  finally{ const b=$("#auBtn"); if(b){ b.disabled=false; b.textContent=authMode==="signup"?"Créer mon compte":"Se connecter"; } }
}
async function forgotPw(){
  const e=($("#auE").value||"").trim(); if(!e){ $("#auErr").textContent="Écris ton e-mail au-dessus d'abord."; return; }
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  $("#auErr").style.color=error?"var(--bad)":"var(--txt)"; $("#auErr").textContent=error?authErrFr(error.message):"📧 Mail envoyé : clique sur le lien pour choisir un nouveau mot de passe.";
}
function newPasswordBox(){ modal(`<h3>🔑 Nouveau mot de passe</h3><input id="npw" class="field" type="password" placeholder="6 caractères minimum"><button class="btn" onclick="setNewPw()">Enregistrer</button>`); }
async function setNewPw(){ const w=$("#npw").value; if(w.length<6){ toast("6 caractères minimum"); return; } const {error}=await sb.auth.updateUser({password:w}); if(error){ toast(authErrFr(error.message)); return; } closeModal(); toast("✓ Mot de passe changé"); }
function useOffline(){ S.settings.offline=true; saveMeta(); tab="home"; animateNext=true; render(); }
async function logout(){ try{ flushWrites(); await sb.auth.signOut(); }catch(e){} try{ localStorage.removeItem("muscu"); }catch(e){} location.reload(); }
async function changePseudo(v){ v=(v||"").trim().slice(0,20); if(v.length<2||!sbUser) return; const {error}=await sb.from("profiles").update({pseudo:v}).eq("id",sbUser.id); if(error){ toast("Erreur"); return; } sbProfile.pseudo=v; S.settings.name=v; saveMeta(); publishStats(); toast("✓ Pseudo changé"); render(); }
function accountCard(){
  if(!CFG) return "";
  if(sbUser) return `<h2>Compte</h2><div class="card"><div class="row" style="margin-bottom:10px"><span style="font-size:26px">👤</span><div class="grow"><b>${esc(sbProfile&&sbProfile.pseudo||"")}</b><div class="small mut">${esc(sbUser.email||"")}</div></div><span class="pill">Synchro ✓</span></div>
    <label class="l">Pseudo visible par tes potes</label><input class="field" value="${esc(sbProfile&&sbProfile.pseudo||"")}" maxlength="20" onchange="changePseudo(this.value)">
    <button class="btn danger" onclick="confirmBox('Te déconnecter ? Tes données restent sauvegardées en ligne.','logout()')">Se déconnecter</button></div>`;
  return `<h2>Compte</h2><div class="card"><div class="small mut" style="margin-bottom:10px">Tu utilises l'app sans compte : tes données restent sur ce téléphone. Crée un compte pour les sauvegarder en ligne et jouer avec tes potes. Tes données actuelles seront gardées.</div><button class="btn" onclick="authMode='signup';tab='auth';animateNext=true;render()">Créer un compte / Se connecter</button></div>`;
}

/* ---------- Classement entre potes ---------- */
let rangsSeg="moi", potes={groups:null,sel:null,stats:{},members:{},loading:false,metric:"week",cat:"pecs",err:null};
async function loadPotes(force){
  if(!sb||!sbUser||potes.loading) return; if(potes.groups&&!force) return;
  potes.loading=true; potes.err=null;
  try{
    await publishStats();
    const {data:gs,error}=await sb.from("groups").select("id,name,code,owner").order("created_at");
    if(error) throw error;
    potes.groups=gs||[]; if(!potes.sel||!potes.groups.find(g=>g.id===potes.sel)) potes.sel=potes.groups[0]?potes.groups[0].id:null;
    if(potes.groups.length){
      const {data:ms}=await sb.from("group_members").select("group_id,user_id").in("group_id",potes.groups.map(g=>g.id));
      potes.members={}; (ms||[]).forEach(m=>(potes.members[m.group_id]=potes.members[m.group_id]||[]).push(m.user_id));
      const ids=[...new Set((ms||[]).map(m=>m.user_id))];
      const {data:st}=await sb.from("public_stats").select("*").in("user_id",ids);
      potes.stats={}; (st||[]).forEach(x=>potes.stats[x.user_id]=x);
    }
  }catch(e){ potes.err="Impossible de charger les classements."; }
  potes.loading=false; if(tab==="rangs"&&rangsSeg==="potes") render();
}
const METRICS=[["week","⚡ XP semaine"],["level","⭐ Niveau"],["gauge","🔥 Jauge du jour"],["global","🛡️ Rang global"],["regu","📅 Régularité"],["cat","🎯 Par catégorie"]];
function metricVal(x){
  const today=todayKey(), wk=todayKey(new Date(weekStart()));
  switch(potes.metric){
    case "week": { const v=x.week_key===wk?x.xp_week:0; return {v,txt:fr(v)+" XP"}; }
    case "level": return {v:x.level*1e7+x.xp_total,txt:"Niv "+x.level,sub:lvlTitle(x.level)};
    case "gauge": { const v=x.gauge_day===today?x.gauge_pts:0, G=gaugeOf(v); return {v,txt:fr(v)+" pts",sub:G.g.e+" "+G.g.n}; }
    case "global": return {v:x.global_step,txt:rankName(x.global_step),step:x.global_step};
    case "regu": return {v:x.sessions_30,txt:x.sessions_30+" séance"+(x.sessions_30>1?"s":""),sub:"sur 30 jours"};
    case "cat": { const v=(x.ranks||{})[potes.cat]; const st=v==null?-1:v; return {v:st,txt:rankName(st),step:st}; }
  }
}
function viewPotes(){
  if(!CFG) return `<div class="card" style="text-align:center"><div style="font-size:40px">🏆</div><b>Classements entre potes</b><div class="small mut" style="margin-top:6px">Disponible dans la version en ligne de l'app (avec compte), pas dans cet aperçu.</div></div>`;
  if(!sbUser) return `<div class="card" style="text-align:center"><div style="font-size:40px">🏆</div><b>Défie tes potes</b><div class="small mut" style="margin:6px 0 12px">Crée un compte pour rejoindre un groupe et comparer vos niveaux, XP, jauges et rangs.</div><button class="btn" onclick="authMode='signup';tab='auth';animateNext=true;render()">Créer un compte</button></div>`;
  if(potes.groups===null){ loadPotes(); return `<div class="empty">Chargement des classements…</div>`; }
  const actions=`<div class="grid2" style="margin-bottom:12px"><button class="btn sec" onclick="createGroupBox()">＋ Créer un groupe</button><button class="btn sec" onclick="joinGroupBox()">🔑 Rejoindre</button></div>`;
  if(potes.err) return `<div class="card small" style="color:var(--bad)">${potes.err}</div><button class="btn sec" onclick="loadPotes(true)">Réessayer</button>`;
  if(!potes.groups.length) return actions+`<div class="card" style="text-align:center"><div style="font-size:40px">👥</div><b>Aucun groupe pour l'instant</b><div class="small mut" style="margin-top:6px">Crée un groupe et partage le code à tes potes, ou rejoins le leur avec leur code.</div></div>`;
  const g=potes.groups.find(x=>x.id===potes.sel)||potes.groups[0];
  const rows=(potes.members[g.id]||[]).map(id=>potes.stats[id]).filter(Boolean).map(x=>({x,...metricVal(x)})).sort((a,b)=>b.v-a.v);
  const isRank=potes.metric==="global"||potes.metric==="cat";
  const pic=(r,size)=>isRank?emblem(r.step>=0?Math.floor(r.step/3):-1,size,false,r.step>=0?r.step%3:null):lvlBadge(r.x.level,size);
  const medal=["🥇","🥈","🥉"];
  const pod=rows.slice(0,3), order=pod.length===3?[1,0,2]:pod.length===2?[1,0]:[0];
  const podium=`<div class="podium">${order.map(i=>{ const r=pod[i]; if(!r) return ""; const me=r.x.user_id===sbUser.id; return `<div class="pod p${i+1}" style="--d:${i}"><div class="pod-pic">${pic(r,i===0?64:52)}</div><b class="pod-name">${esc(r.x.pseudo||"?")}${me?" (toi)":""}</b><div class="pod-val">${r.txt}</div><div class="pod-step">${medal[i]}</div></div>`; }).join("")}</div>`;
  const list=rows.slice(3).map((r,i)=>{ const me=r.x.user_id===sbUser.id; return `<div class="lb-row ${me?"me":""}" style="--i:${i}"><b class="lb-pos">${i+4}</b><div style="flex:none">${pic(r,36)}</div><div class="grow"><b>${esc(r.x.pseudo||"?")}${me?` <span class="pill">toi</span>`:""}</b>${r.sub?`<div class="small mut">${esc(r.sub)}</div>`:""}</div><b>${r.txt}</b></div>`; }).join("");
  const myPos=rows.findIndex(r=>r.x.user_id===sbUser.id);
  return actions+`
  ${potes.groups.length>1?`<div class="hscroll" style="margin-bottom:10px">${potes.groups.map(x=>`<button class="chip ${x.id===g.id?"on":""}" style="flex:none" onclick="potes.sel='${x.id}';render()">${esc(x.name)}</button>`).join("")}</div>`:""}
  <div class="card row" style="gap:12px"><div class="grow"><b style="font-size:18px">${esc(g.name)}</b><div class="small mut">${rows.length} membre${rows.length>1?"s":""}${myPos>=0?` · tu es ${myPos+1}${myPos===0?"er":"e"}`:""}</div></div>
    <button class="chip" onclick="shareCode('${g.code}','${esc(g.name).replace(/'/g,"")}')" style="font-family:ui-monospace,monospace;font-weight:900;letter-spacing:2px">🔗 ${g.code}</button></div>
  <div class="hscroll" style="margin-bottom:8px">${METRICS.map(([k,l])=>`<button class="chip ${potes.metric===k?"on":""}" style="flex:none" onclick="potes.metric='${k}';animateNext=true;render()">${l}</button>`).join("")}</div>
  ${potes.metric==="cat"?`<div class="hscroll" style="margin-bottom:8px">${CATS.map(c=>`<button class="chip ${potes.cat===c.id?"on":""}" style="flex:none" onclick="potes.cat='${c.id}';animateNext=true;render()">${c.ic} ${c.name}</button>`).join("")}</div>`:""}
  ${podium}
  ${list?`<div class="card" style="padding:4px 12px">${list}</div>`:""}
  <div class="row" style="gap:8px;margin-top:4px"><button class="btn sec" onclick="loadPotes(true)">↻ Actualiser</button><button class="btn danger" style="width:auto;padding:13px 16px" onclick="confirmBox('Quitter le groupe « ${esc(g.name).replace(/'/g,"")} » ?','leaveGroup(\\'${g.id}\\')')">Quitter</button></div>
  <div class="note" style="text-align:center">Seuls tes scores sont partagés (XP, niveau, jauge, rangs). Ton poids et ta nutrition restent privés.</div>`;
}
function createGroupBox(){ modal(`<h3>＋ Créer un groupe</h3><input id="gN" class="field" maxlength="30" placeholder="ex. La Team du BTS"><button class="btn" onclick="createGroup()">Créer</button>`); setTimeout(()=>$("#gN")&&$("#gN").focus(),100); }
async function createGroup(){ const n=($("#gN").value||"").trim(); if(n.length<2){ toast("Nom trop court"); return; } const {data,error}=await sb.rpc("create_group",{gname:n}); if(error){ toast("Erreur : "+error.message); return; } closeModal(); potes.sel=data.id; await loadPotes(true); confetti(50); modal(`<div style="text-align:center"><div style="font-size:44px">🎉</div><h3>Groupe créé !</h3><div class="small mut">Envoie ce code à tes potes :</div><div style="font-size:38px;font-weight:900;letter-spacing:6px;font-family:ui-monospace,monospace;margin:12px 0;color:var(--acc)">${data.code}</div><button class="btn" onclick="shareCode('${data.code}','${n.replace(/'/g,"")}')">🔗 Partager le code</button></div>`); }
function joinGroupBox(){ modal(`<h3>🔑 Rejoindre un groupe</h3><input id="gC" class="field" maxlength="6" placeholder="Code à 6 caractères" style="text-transform:uppercase;letter-spacing:4px;font-weight:900;text-align:center;font-size:22px"><button class="btn" onclick="joinGroup()">Rejoindre</button>`); setTimeout(()=>$("#gC")&&$("#gC").focus(),100); }
async function joinGroup(){ const c=($("#gC").value||"").trim(); if(c.length<4){ toast("Code invalide"); return; } const {data,error}=await sb.rpc("join_group",{gcode:c}); if(error){ toast(/invalide/i.test(error.message)?"❌ Code invalide":"Erreur : "+error.message); return; } closeModal(); potes.sel=data.id; await loadPotes(true); confetti(50); toast("✅ Tu as rejoint « "+data.name+" »"); }
async function leaveGroup(id){ await sb.from("group_members").delete().eq("group_id",id).eq("user_id",sbUser.id); potes.sel=null; await loadPotes(true); toast("Groupe quitté"); }
async function shareCode(code,name){
  const txt=`Rejoins mon groupe « ${name} » sur Suivi Muscu 💪\nCode : ${code}\n${location.origin+location.pathname}`;
  try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(txt); toast("📋 Invitation copiée"); }catch(e){ toast("Code : "+code); }
}
/* ---------- App installable ---------- */
if(CFG){
  const add=(tag,attrs)=>{ const e=document.createElement(tag); Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v)); document.head.appendChild(e); };
  add("link",{rel:"manifest",href:"manifest.webmanifest"}); add("link",{rel:"apple-touch-icon",href:"icon-192.png"});
  add("meta",{name:"apple-mobile-web-app-capable",content:"yes"}); add("meta",{name:"apple-mobile-web-app-status-bar-style",content:"black-translucent"}); add("meta",{name:"apple-mobile-web-app-title",content:"Suivi Muscu"});
  if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
}

applyTheme();
render();
initStore();
</script>
