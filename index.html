<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b" id="themeColor">
<title>Suivi Muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--card:#141416;--card2:#1c1c20;--line:#2a2a30;--txt:#f2f2f4;--mut:#8e8e98;
  --acc:#e5202e;--acc-ink:#fff;--acc-soft:rgba(229,32,46,.14);--acc-line:rgba(229,32,46,.38);
  --blue:#5bb2ff;--org:#ffb547;--bad:#ff9f43;--pink:#ff8fd1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--r:16px;--font:Inter;--hfont:Inter}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font),Inter,system-ui,sans-serif;font-size:16px}
body{background:transparent!important}
h1,h2,.big,.tn,.rk-name,.rk-pre{font-family:var(--hfont),var(--font),Inter,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom));transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:active{transform:scale(.97)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px}
h2{font-size:12.5px;font-weight:800;color:var(--mut);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
h2 a{color:var(--acc);text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer}
.hdr-r{display:flex;align-items:center;gap:8px}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.dot.ok{background:#3ddc84}
.gear{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.gear svg{width:19px;height:19px}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:800;border-radius:12px;padding:13px 16px;width:100%;font-size:16px;letter-spacing:.2px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:700}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:700}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:13px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:10.5px;font-weight:700;position:relative}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}
nav .live{position:absolute;top:3px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.exhead b{font-size:17px}
.prev{font-size:12px;color:var(--mut);margin-bottom:8px}
.set,.lbl{display:grid;grid-template-columns:28px 1fr 1fr 46px 28px;gap:8px;align-items:center}
.set{margin:6px 0}
.set .n{color:var(--mut);font-weight:700;text-align:center;font-size:14px}
.set input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-size:16px;font-weight:700}
.set input:focus,.field:focus{outline:none;border-color:var(--acc)}
.set.done input{border-color:var(--acc-line);background:var(--acc-soft)}
.chk{width:46px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:900}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.del{color:var(--mut);font-size:20px;line-height:1;padding:4px 6px}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:10px 12px 10px 18px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 4px var(--acc-soft);z-index:9;font-size:18px;font-variant-numeric:tabular-nums}
.timer button{background:rgba(0,0,0,.18);border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;color:var(--acc-ink)}
.hist{cursor:pointer}
.hist .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist .d{font-size:13px;color:var(--mut);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:800}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 12px;font-size:19px}
.list button{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-bottom:10px}
select.field{appearance:none;-webkit-appearance:none}
textarea.field{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}
label.l{display:block;font-size:12px;color:var(--mut);margin:0 0 5px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
svg.chart text{fill:var(--mut);font-size:11px;font-family:Inter,sans-serif}
.empty{text-align:center;color:var(--mut);padding:30px 10px;line-height:1.5}
.pill{font-size:12px;background:var(--acc-soft);color:var(--acc);padding:3px 8px;border-radius:999px;font-weight:800;white-space:nowrap}
.pill.bad{background:rgba(255,159,67,.14);color:var(--bad)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;animation:fade .2s;white-space:nowrap;font-weight:600}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .5s}
.macro{background:var(--card2);border-radius:12px;padding:10px}
.macro b{font-size:18px;display:block}
.macro span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.food{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.datenav b{font-size:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:24px;font-weight:800}
.ring .c span{font-size:11px;color:var(--mut)}
.pr{color:var(--org);font-weight:800}
.note{font-size:12px;color:var(--mut);line-height:1.45;margin-top:10px}
.restsel{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin:-8px 0 14px;flex-wrap:wrap}
/* Programmes */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.prog-card{flex:none;width:170px;display:flex;flex-direction:column;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;position:relative;overflow:hidden}
.prog-card:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
.prog-card b{display:block;font-size:15px;margin-bottom:4px}
.prog-card span{font-size:12px;color:var(--mut);line-height:1.35;display:block}
.tag{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);margin-bottom:6px;display:block}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:800}
.stepper b{min-width:22px;text-align:center}
/* Réglages */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw.on{border-color:var(--txt)}
/* Rangs */
.rk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rk-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;position:relative;overflow:hidden}
.rk-card .glow{position:absolute;inset:-40% -40% auto;height:120%;opacity:.18;pointer-events:none}
.rk-card .cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-top:6px}
.rk-card .tier{font-size:17px;font-weight:900;margin-top:2px;letter-spacing:.3px}
.rk-card .val{font-size:12px;color:var(--mut);margin-top:2px}
.rk-card .bar{height:5px}
.mystery svg{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);filter:drop-shadow(0 0 10px var(--acc))}}
.rk-hero{display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.th-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.th-row:last-child{border-bottom:0}
.th-row.cur{background:var(--acc-soft);margin:0 -10px;padding:8px 10px;border-radius:10px;border-bottom-color:transparent}
/* Animation de rang */
.rk-ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c) 22%,#000) 0%,#000 70%);animation:fade .3s;overflow:hidden;text-align:center;padding:20px}
.rk-rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 30%,transparent) 0 6deg,transparent 6deg 18deg);border-radius:50%;opacity:0;animation:rays 1s ease-out var(--pop) forwards,spin 18s linear var(--pop) infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
@keyframes rays{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.rk-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .5s ease-out var(--pop)}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.rk-stage{position:relative;width:210px;height:210px;margin:10px 0 6px}
.rk-stage>div{position:absolute;inset:0;display:grid;place-items:center}
.rk-new{opacity:0;transform:scale(.2) rotate(-200deg);animation:pop .8s cubic-bezier(.2,1.6,.4,1) var(--pop) forwards}
.rk-new svg{filter:drop-shadow(0 0 28px var(--c))}
@keyframes pop{to{opacity:1;transform:scale(1) rotate(0)}}
.rk-old{animation:shake .9s ease-in-out .2s,shatter .35s ease-in calc(var(--pop) - .25s) forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(8px) rotate(4deg)}}
@keyframes shatter{to{transform:scale(1.8);opacity:0;filter:blur(8px) brightness(3)}}
.rk-mys{animation:mys .9s ease-in-out infinite,shatter .35s ease-in calc(var(--pop) - .25s) forwards}
@keyframes mys{50%{transform:scale(1.08) rotate(3deg)}}
.rk-p{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:2px;background:var(--c);opacity:0;animation:burst 1.1s cubic-bezier(.1,.8,.3,1) var(--pop) forwards}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(.3) rotate(220deg)}}
.rk-txt{opacity:0;transform:translateY(16px);animation:rise .5s ease-out calc(var(--pop) + .35s) forwards;position:relative}
.rk-pre{font-size:13px;font-weight:900;letter-spacing:3px;color:var(--c);text-transform:uppercase;position:relative}
.rk-name{font-size:44px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--c);text-shadow:0 0 30px var(--c);margin:2px 0}
.rk-sub{color:#cfd0d6;font-size:15px;margin-bottom:22px}
.rk-btns{display:flex;gap:10px;width:100%;max-width:320px;opacity:0;animation:rise .4s ease-out calc(var(--pop) + .7s) forwards;position:relative}
.rk-btns .btn{background:var(--c);color:#000}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

/* ===== Animations globales ===== */
button{transition:transform .12s ease,background .2s,color .2s,border-color .2s}
button:active{transform:scale(.95)}
.enter>*{animation:inUp .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes inUp{from{opacity:0;transform:translateY(18px) scale(.98)}}
.enter .bar i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both .25s}
@keyframes grow{from{width:0}}
nav button.on.bump svg{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:translateY(-5px) scale(1.2)}}
.set.pop .chk{animation:chkpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes chkpop{40%{transform:scale(1.3) rotate(-8deg)}}
.set.pop input{animation:flashIn .6s}
@keyframes flashIn{0%{box-shadow:0 0 0 0 var(--acc-line)}100%{box-shadow:0 0 0 10px transparent}}
.xpfloat{position:fixed;z-index:70;font-weight:900;font-size:17px;color:var(--acc);pointer-events:none;animation:xpf 1.1s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.7);white-space:nowrap}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1;transform:translate(-50%,-16px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.toast{animation:toastIn .4s cubic-bezier(.2,1.5,.4,1)!important;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-24px) scale(.85)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r,720deg))}}
.sheet{animation:up .35s cubic-bezier(.2,1.2,.4,1)!important}
.card,.prog-card,.rk-card{transition:transform .15s,border-color .2s}
.card[onclick]:active,.prog-card:active,.rk-card:active{transform:scale(.98)}
/* ===== Accueil ===== */
.gauge-card{position:relative;overflow:hidden;text-align:center;padding:16px 14px 14px}
.gauge-card .bgglow{position:absolute;inset:-30% -20% auto;height:90%;background:radial-gradient(circle,var(--gc) 0%,transparent 65%);opacity:.22;pointer-events:none;transition:background .4s}
.gauge{position:relative;width:270px;height:225px;margin:0 auto}
.gauge svg{position:absolute;inset:0}
.garc{animation:sweep 1.6s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes sweep{from{stroke-dashoffset:var(--len)}}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
.gauge .emo{font-size:58px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-7px) rotate(-5deg)}}
.gauge .tn{font-size:23px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-top:6px;text-shadow:0 0 22px var(--gc)}
.gauge .sc{font-size:12px;color:var(--mut);font-weight:700}
.gauge.tierup .emo{animation:tierup 1s cubic-bezier(.2,1.6,.4,1),bob 2.6s ease-in-out 1s infinite}
@keyframes tierup{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.35) rotate(10deg)}}
.gphrase{font-size:14px;color:var(--txt);opacity:.85;margin:2px 10px 12px;font-style:italic;min-height:20px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini3 div{background:var(--card2);border-radius:12px;padding:9px 6px}
.mini3 b{display:block;font-size:18px;font-weight:900}
.mini3 span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.nextt{font-size:12px;color:var(--mut);margin-top:10px}
.week{display:flex;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:800}
.wd i{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:15px;transition:all .3s}
.wd.on i{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 4px 14px var(--acc-soft)}
.wd.today i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.enter .wd.on i{animation:popIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--d) * 70ms + .3s)}
@keyframes popIn{from{transform:scale(0)}}
.livecard{border-color:var(--acc-line)!important;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--acc-soft)}}
.livedot{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block;animation:blink 1s infinite;margin-right:6px}
@keyframes blink{50%{opacity:.25}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;font-weight:800;font-size:15px}
.qa button span{display:block;font-size:24px;margin-bottom:6px}
.qa button small{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:2px}
.qa button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.qa button.main small{color:inherit;opacity:.75}
/* ===== Difficulté ===== */
.diff{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--dc) 16%,transparent);color:var(--dc);white-space:nowrap}
.pips{display:inline-flex;gap:2px}
.pips b{width:4px;height:10px;border-radius:2px;background:currentColor;opacity:.25}
.pips b.f{opacity:1}
.prog-card .diff{display:inline-flex!important;margin-top:auto;padding-top:3px;align-self:flex-start;color:var(--dc)!important;font-size:11px!important;line-height:1.2}
.prog-card .diff .pips{display:inline-flex!important;color:inherit!important;margin:0!important}

function effortTag(n){ const c=coefOf(n); return c>=1.5?"⚡⚡⚡":c>=1.2?"⚡⚡":"⚡"; }
function repsEq(name,r){ r=num(r); return name.includes("(sec)")?r/3:name==="Corde à sauter (min)"?r*10:r; }
function setXP(name,kg,reps){ const r=Math.min(30,repsEq(name,reps)); if(r<=0) return 0; return coefOf(name)*(4+r*.6)*(1+Math.min(num(kg),200)/120); }
function sessionRawXP(s,durMin){
  let n=0, xp=0;
  for(const e of s.exercises) for(const x of e.sets){ if(!x.done) continue; if(++n>XP_SET_CAP) break; xp+=setXP(e.name,x.kg,x.reps); }
  if(!n) return 0;
  const d=durMin??s.duration??0;
  return Math.round(xp + Math.min(d,150)*.4 + 20);
}

    w.busy=false;

  };

  if(delay) w.t=setTimeout(()=>{ w.pending=null; go(); },delay); else { w.pending=null; return go(); }
}

function lastFor(name){ for(const s of S.sessions){ const e=s.exercises.find(x=>x.name===name); if(e){ const d=e.sets.filter(x=>x.done); if(d.length) return {date:s.date,sets:d}; } } return null; }
function bestFor(name){ let b=0; for(const s of S.sessions) for(const e of s.exercises) if(e.name===name) for(const x of e.sets) if(x.done) b=Math.max(b,e1rm(num(x.kg),num(x.reps))); return b; }
function allExercises(){ const set=new Set(S.custom); S.sessions.forEach(s=>s.exercises.forEach(e=>set.add(e.name))); Object.values(PRESETS).flat().forEach(n=>set.add(n)); return [...set]; }
function usedExercises(){ const set=new Set(); S.sessions.forEach(s=>s.exercises.forEach(e=>{ if(e.sets.some(x=>x.done)) set.add(e.name); })); return [...set]; }
function curWeight(){ return S.weights.length?S.weights[S.weights.length-1].kg:null; }
function streakWeeks(){ let n=0; for(let w=0;w<52;w++){ const end=Date.now()-w*7*864e5, start=end-7*864e5; if(S.sessions.some(s=>s.date>start&&s.date<=end)) n++; else if(w>0) break; } return n; }

/* ---- Calories (Mifflin-St Jeor) ---- */
function calc(goalKey){
  const p=S.profile, kg=curWeight(), age=num(p.age), cm=num(p.taille);
  if(!kg||!age||!cm) return null;
  const bmr=10*kg+6.25*cm-5*age+(p.sexe==="H"?5:-161), tdee=bmr*num(p.act);
  const g=GOALS.find(x=>x.k===(goalKey||p.goal))||GOALS[1], floor=p.sexe==="H"?1500:1200;
  let target=Math.round((tdee+g.d)/10)*10, floored=false; if(target<floor){ target=floor; floored=true; }
  target=Math.round((target+num(p.kcalAdj||0))/10)*10;
  const pk=num(p.protKg||2), fk=num(p.fatKg||.8);
  const ref=Math.min(kg,Math.max(cm-100,45)), prot=Math.round(pk*ref), fat=Math.round(fk*ref);
  const carbs=Math.max(0,Math.round((target-prot*4-fat*9)/4));
  return {bmr,tdee,target,prot,fat,carbs,weekly:(target-tdee)/1100,ref,floored};
}
function dayTotals(k,meal){ const it=(S.days[k]||[]).filter(x=>!meal||(x.m||"snack")===meal); const sum=f=>it.reduce((a,x)=>a+num(x[f]),0); return {kcal:sum("k"),p:sum("p"),c:sum("c"),f:sum("f"),n:it.length}; }

/* ---- Rangs ---- */
function stepsAvg7(){ const v=[]; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); const n=num((S.steps||{})[todayKey(d)]); if(n>0) v.push(n); } return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0; }
function catScore(cat){
  if(cat.special==="steps"){ const has=Object.values(S.steps||{}).some(n=>num(n)>0); return {score:stepsAvg7(),has}; }
  if(cat.special==="regu"){ const n=S.sessions.filter(s=>s.date>Date.now()-30*864e5).length; return {score:n,has:S.sessions.length>0}; }
  let best=0, has=false;
  for(const s of S.sessions) for(const e of s.exercises){
    const src=cat.src.find(x=>x[0]===e.name); if(!src) continue;
    for(const x of e.sets){ if(!x.done) continue; has=true;
      const v=src[1]==="e1"?e1rm(num(x.kg),num(x.reps)):num(x.reps);
      best=Math.max(best,v*src[2]); }
  }
  return {score:Math.round(best*10)/10,has};
}
const DIVS=["I","II","III"];
// 21 paliers : 7 rangs × 3 divisions
function stepThs(c){
  if(c._st) return c._st;
  const isKg=c.unit.includes("kg"), out=[];
  const NT=c.th.length;
  for(let i=0;i<NT;i++){ const lo=c.th[i], hi=i<NT-1?c.th[i+1]:c.th[NT-1]*1.2;
    for(let d=0;d<3;d++){ let v=lo+(hi-lo)*d/3; v=isKg?Math.round(v*2)/2:Math.round(v); if(d===0) v=lo; const prev=out[out.length-1]; if(prev!==undefined&&v<=prev) v=prev+(isKg?.5:1); out.push(v); } }
  return c._st=out;
}
function stepOf(score,c){ const st=stepThs(c); let k=-1; st.forEach((v,i)=>{ if(score>=v) k=i; }); return k; }
function rankName(step){ return step<0?"Non classé":TIERS[Math.floor(step/3)].n+" "+DIVS[step%3]; }
function allRanks(){ const o={}, mk=(s,c)=>{ const step=s.has?stepOf(s.score,c):-1; return {...s,step,tier:step<0?-1:Math.floor(step/3),div:step<0?0:step%3}; };
  CATS.filter(c=>!c.composite).forEach(c=>{ o[c.id]=mk(catScore(c),c); });
  // rang composé : moyenne des sous-rangs (un sous-rang vide compte 0)
  CATS.filter(c=>c.composite).forEach(c=>{ const subs=c.composite.map(id=>o[id]); const has=subs.some(x=>x.step>=0); const score=Math.round(subs.reduce((a,x)=>a+(x.step+1),0)/subs.length*10)/10; o[c.id]=mk({score,has},c); });
  return o; }
function topCats(){ return CATS.filter(c=>!c.parent); }
function globalRank(r){ const v=topCats().map(c=>({...r[c.id],w:c.w||1})).filter(x=>x.step>=0); if(!v.length) return {tier:-1,step:-1,n:0,power:0}; const W=v.reduce((a,x)=>a+x.w,0), avg=v.reduce((a,x)=>a+x.step*x.w,0)/W, step=Math.floor(avg+.0001); return {step,tier:Math.floor(step/3),div:step%3,avg,n:v.length,power:Math.round(v.reduce((a,x)=>a+(x.step+1)*100*x.w,0))}; }
function migrateRanks(){
  if(S.rankV===3) return; const r=allRanks();
  if(S.rankV!==2){ Object.keys(S.seen||{}).forEach(id=>{ if(r[id]) S.seen[id]=r[id].step; }); }
  // v3 : l'ancien rang « Bras » devient le sous-rang Biceps, le nouveau Bras est composé
  if(S.seen&&S.seen.bras!==undefined){ S.seen.biceps=S.seen.bras; if(r.bras.step>=0) S.seen.bras=r.bras.step; else delete S.seen.bras; if(r.avantbras.step>=0) S.seen.avantbras=r.avantbras.step; }
  S.rankV=3; }

function predatorFX(id,T){
  const smoke=[[-16,0,22],[18,.7,20],[0,1.4,26]].map(([dx,d,r])=>`<circle cx="${50+dx}" cy="${48}" r="${r}" fill="#000" filter="url(#${id}f)" opacity=".75"><animate attributeName="cy" values="52;40;52" dur="${3+d}s" repeatCount="indefinite"/><animate attributeName="r" values="${r};${r+8};${r}" dur="${3+d}s" repeatCount="indefinite"/></circle>`).join("");
  const spikes=Array.from({length:16},(_,i)=>{ const a=i*Math.PI/8, r1=56, r2=i%2?66:72, w=.09; const P=(r,aa)=>`${(50+r*Math.cos(aa)).toFixed(1)},${(50+r*Math.sin(aa)).toFixed(1)}`; return `<path d="M${P(r1,a-w)} L${P(r2,a)} L${P(r1,a+w)}Z" fill="#0a0a0c" stroke="${T.c}" stroke-width=".8"/>`; }).join("");
  const bolt=(rot,dl)=>`<g transform="rotate(${rot} 50 50)"><path d="M50,-8 L46,4 L52,4 L47,16" fill="none" stroke="#ff5a6e" stroke-width="2" stroke-linejoin="round" opacity="0" filter="url(#${id}f)"><animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;.7;.75;.8;.85;1" dur="2.6s" begin="${dl}s" repeatCount="indefinite"/></path><path d="M50,-8 L46,4 L52,4 L47,16" fill="none" stroke="#fff" stroke-width=".9" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;.7;.75;.8;.85;1" dur="2.6s" begin="${dl}s" repeatCount="indefinite"/></path></g>`;
  const back=`${smoke}<g>${spikes}<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="24s" repeatCount="indefinite"/></g>
    <circle cx="50" cy="50" r="60" fill="none" stroke="${T.c}" stroke-width="1.2" opacity=".8"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/></circle>`;
  const embers=[0,1.2,2.4,3.6,4.8].map((b,i)=>`<circle r="${i%2?1.6:2.4}" fill="${i%2?"#ff8a95":T.c}" filter="url(#${id}f)"><animateMotion dur="6s" begin="-${b}s" repeatCount="indefinite" path="M50,-12 A62,62 0 1,0 49.9,-12"/></circle>`).join("");
  const front=`${bolt(-35,0)}${bolt(40,.9)}${bolt(160,1.7)}${embers}
    <path d="M30,10 L33,-8 L42,3 L50,-14 L58,3 L67,-8 L70,10" fill="none" stroke="${T.c}" stroke-width="2.2" filter="url(#${id}f)"><animate attributeName="opacity" values=".3;1;.3" dur="1.3s" repeatCount="indefinite"/></path>`;
  return {back,front};
}
function ultimeFX(id,T){
  if(T.predator) return predatorFX(id,T);
  const rays=Array.from({length:12},(_,i)=>`<path d="M50,50 L${(50+70*Math.cos(i*Math.PI/6-.06)).toFixed(1)},${(50+70*Math.sin(i*Math.PI/6-.06)).toFixed(1)} L${(50+70*Math.cos(i*Math.PI/6+.06)).toFixed(1)},${(50+70*Math.sin(i*Math.PI/6+.06)).toFixed(1)}Z" fill="${i%2?T.c:"#fff"}" opacity=".18"/>`).join("");
  const back=`<g>${rays}<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="16s" repeatCount="indefinite"/></g>
    <circle cx="50" cy="50" r="62" fill="none" stroke="${T.c}" stroke-width="2.5" stroke-dasharray="2 5" opacity=".9"><animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="7s" repeatCount="indefinite"/></circle>`;
  const orbit=[0,1.5,3,4.5].map((b,i)=>`<g><path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1Z" fill="#fff"/><animateMotion dur="6s" begin="-${b}s" repeatCount="indefinite" path="M50,-14 A64,64 0 1,1 49.9,-14"/></g>`).join("");
  return {back,front:orbit};
}
function emblem(t,size,mys,div,shapeKey,themeKey){
  const key=themeKey||S.settings.rankTheme||"classic";
  if(key==="classic"||t<0||mys) return classicEmblem(t,size,mys,div,key==="classic"?shapeKey:"medal");
  const th=RANK_THEMES[key], T=th.tiers[t], id="e"+(++embN);
  const R={belts:drawBelt,army:drawArmy,cosmos:drawCosmos,animals:drawEmoji,gym:drawEmoji}[key];
  const {art,clip,pipY,noPips}=R(t,T,id,div);
  return fxWrap(t,size,noPips?null:div,T,id,art,clip,pipY);
}
// Effets communs : statique jusqu'à t=3, animé à partir de t=4
function fxWrap(t,size,div,T,id,art,clip,pipY){
  const py=pipY||82;
  const pips=div==null?"":`<g>${[0,1,2].map(i=>{ const x=40+i*10, on=i<=div; return `<path d="M${x},${py} l3.8,3.8 l-3.8,3.8 l-3.8,-3.8Z" fill="${on?"#fff":"rgba(0,0,0,.45)"}" stroke="${on?"#fff":"rgba(255,255,255,.4)"}" stroke-width="1"/>`; }).join("")}</g>`;
  const defs=`<defs><radialGradient id="${id}a"><stop offset="0" stop-color="${T.c}" stop-opacity=".75"/><stop offset=".55" stop-color="${T.c}" stop-opacity=".18"/><stop offset="1" stop-color="${T.c}" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="${id}c"><path d="${clip}"/></clipPath><filter id="${id}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
  if(t<4) return `<svg viewBox="-4 -4 108 108" width="${size}" height="${size}">${defs}${art}${pips}</svg>`;
  const spin=(dur,rev)=>`<animateTransform attributeName="transform" type="rotate" from="${rev?360:0} 50 50" to="${rev?0:360} 50 50" dur="${dur}s" repeatCount="indefinite"/>`;
  const spark=(x,y,sc,dl)=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4Z" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="${dl}s" repeatCount="indefinite"/></path></g>`;
  const aura=`<circle cx="50" cy="50" r="${t>=6?64:58}" fill="url(#${id}a)"><animate attributeName="opacity" values=".45;1;.45" dur="${t>=6?1.6:2.6}s" repeatCount="indefinite"/></circle>`;
  const r1=`<circle cx="50" cy="50" r="56" fill="none" stroke="${T.c}" stroke-width="1.6" stroke-dasharray="1.5 7" stroke-linecap="round">${spin(14)}</circle>`;
  const r2=t>=5?`<circle cx="50" cy="50" r="51" fill="none" stroke="${T.c}" stroke-width="1" stroke-dasharray="14 6" opacity=".5">${spin(9,1)}</circle>`:"";
  const flames=t>=6?[[-14,0],[0,.35],[14,.7]].map(([dx,d])=>`<ellipse cx="${50+dx}" cy="30" rx="16" ry="34" fill="${T.c}" filter="url(#${id}f)" opacity=".45"><animate attributeName="ry" values="30;40;30" dur="${.9+d}s" repeatCount="indefinite"/><animate attributeName="cy" values="34;22;34" dur="${.9+d}s" repeatCount="indefinite"/></ellipse>`).join(""):"";
  const embers=t>=6?[0,1.2,2.4,3.6].map((b,i)=>`<circle r="${i%2?1.8:2.6}" fill="${i%2?"#fff":T.c}"><animateMotion dur="4.8s" begin="-${b}s" repeatCount="indefinite" path="M50,-6 A56,56 0 1,1 49.9,-6"/></circle>`).join(""):"";
  const shine=`<g clip-path="url(#${id}c)"><rect x="-40" y="-10" width="20" height="130" fill="url(#${id}w)" transform="skewX(-18)" opacity=".6"><animate attributeName="x" values="-60;-60;150" keyTimes="0;.55;1" dur="${t>=6?2.4:3.2}s" repeatCount="indefinite"/></rect></g>`;
  const sparks=[[-2,8,.9,0],[104,4,.8,.8],[100,92,.7,1.5],[0,96,.75,.4],...(t>=5?[[50,-14,.7,1.1],[110,52,.6,1.8]]:[]),...(t>=6?[[-12,52,.8,.6],[86,-12,.7,1.3]]:[])].map(a=>spark(...a)).join("");
  const ult=T.ultime?ultimeFX(id,T):{back:"",front:""};
  const sz=Math.round(size*(T.ultime?1.3:1.2));
  return `<svg viewBox="-20 -20 140 140" width="${sz}" height="${sz}" class="${T.ultime?"ultime":""}" style="overflow:visible;margin:${-(sz-size)/2}px">${defs}${ult.back}${aura}${flames}${r1}${r2}${art}${shine}${pips}${embers}${sparks}${ult.front}</svg>`;
}
const CIRC="M50,4 A46,46 0 1,1 49.9,4Z";
function badgeBg(T,id,inner){ return `<defs><radialGradient id="${id}bg" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="${inner||"#2a2a33"}"/><stop offset="1" stop-color="#0b0b0f"/></radialGradient></defs>
  <circle cx="50" cy="50" r="46" fill="url(#${id}bg)" stroke="${T.c}" stroke-width="3.5"/><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/>`; }
// --- Ceinture d'arts martiaux ---
function drawBelt(t,T,id,div){
  const B=T.belt, E=T.edge;
  const stripes=[0,1,2].slice(0,div==null?0:div+1).map((_,i)=>{ const f=.55+i*.13, x=55+(62-55)*f, y=55+(81-55)*f; return `<line x1="${x-4.6}" y1="${y+1.5}" x2="${x+4.6}" y2="${y-1.5}" stroke="${T.stripe}" stroke-width="2.6" stroke-linecap="round"/>`; }).join("");
  const art=`${badgeBg(T,id)}<g transform="rotate(-8 50 50)">
    <rect x="8" y="40" width="84" height="13" rx="3" fill="${B}" stroke="${E}" stroke-width="1.6"/>
    ${T.redwhite?[0,1,2,3,4,5].map(i=>`<rect x="${12+i*13.5}" y="40.8" width="6.7" height="11.4" fill="#fff"/>`).join(""):""}
    <line x1="11" y1="43.6" x2="89" y2="43.6" stroke="rgba(0,0,0,.25)" stroke-width="1" stroke-dasharray="2 2"/><line x1="11" y1="49.4" x2="89" y2="49.4" stroke="rgba(0,0,0,.25)" stroke-width="1" stroke-dasharray="2 2"/>
    <path d="M45,52 L34,82 L42,85 L50,57Z" fill="${B}" stroke="${E}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M55,52 L66,82 L58,85 L50,57Z" fill="${B}" stroke="${E}" stroke-width="1.6" stroke-linejoin="round"/>
    ${stripes}
    <rect x="40.5" y="35" width="19" height="23" rx="4.5" fill="${B}" stroke="${E}" stroke-width="1.8"/>
    <path d="M44,40 Q50,46 56,40 M44,53 Q50,47 56,53" stroke="rgba(0,0,0,.28)" stroke-width="1.4" fill="none"/></g>
    <ellipse cx="38" cy="26" rx="20" ry="8" fill="#fff" opacity=".06"/>`;
  return {art,clip:CIRC,noPips:true};
}
// --- Insigne militaire ---
function drawArmy(t,T,id){
  const SH="M50,4 L88,14 L88,48 C88,72 72,87 50,96 C28,87 12,72 12,48 L12,14Z";
  const c=T.c, st=`stroke="${c}" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"`;
  const chev=n=>Array.from({length:n},(_,i)=>`<path d="M28,${58-i*12} L50,${44-i*12} L72,${58-i*12}" ${st}/>`).join("");
  const star=(x,y,r)=>{ let p=""; for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*.42:r; p+=(k?"L":"M")+(x+rr*Math.cos(a)).toFixed(1)+","+(y+rr*Math.sin(a)).toFixed(1); } return `<path d="${p}Z" fill="${c}" stroke="#fff" stroke-width=".8"/>`; };
  const ins=[chev(1),chev(2),chev(3),chev(3)+`<path d="M28,64 Q50,80 72,64" ${st}/>`,
    `<rect x="44.5" y="26" width="11" height="44" rx="2" fill="${c}" stroke="#fff" stroke-width=".8"/>`,
    `<rect x="35" y="26" width="11" height="44" rx="2" fill="${c}" stroke="#fff" stroke-width=".8"/><rect x="54" y="26" width="11" height="44" rx="2" fill="${c}" stroke="#fff" stroke-width=".8"/>`,
    star(28,50,11)+star(50,38,13)+star(72,50,11),
    star(22,52,8)+star(36,40,9)+star(50,34,11)+star(64,40,9)+star(78,52,8)+`<rect x="30" y="58" width="40" height="8" rx="4" fill="${c}" stroke="#fff" stroke-width=".8"/>`][t];
  const art=`<defs><linearGradient id="${id}o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6b33"/><stop offset="1" stop-color="#1e2410"/></linearGradient></defs>
    <path d="${SH}" fill="url(#${id}o)" stroke="${c}" stroke-width="3.5"/>
    <path d="M50,11 L81,19 L81,48 C81,68 68,80 50,88 C32,80 19,68 19,48 L19,19Z" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.2" stroke-dasharray="3 2.5"/>
    <path d="M50,4 L88,14 L88,30 L12,30 L12,14Z" fill="#fff" opacity=".06"/>${ins}`;
  return {art,clip:SH,pipY:74};
}
// --- Objets cosmiques ---
function drawCosmos(t,T,id){
  const spin=(dur,rev)=>`<animateTransform attributeName="transform" type="rotate" from="${rev?360:0} 50 50" to="${rev?0:360} 50 50" dur="${dur}s" repeatCount="indefinite"/>`;
  const dots=[[22,26],[78,24],[70,78],[26,72],[84,52],[16,48],[60,14],[40,86]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%3?.8:1.2}" fill="#fff" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="${2+i%3}s" begin="${i*.3}s" repeatCount="indefinite"/></circle>`).join("");
  const objs=[
    `<g><path d="M34,40 L46,30 L62,33 L70,46 L66,62 L52,70 L38,66 L30,54Z" fill="url(#${id}g)" stroke="#d0d4dc" stroke-width="1.2"/><circle cx="46" cy="44" r="5" fill="rgba(0,0,0,.3)"/><circle cx="58" cy="56" r="3.5" fill="rgba(0,0,0,.3)"/><circle cx="56" cy="40" r="2.5" fill="rgba(0,0,0,.25)"/>${spin(24)}</g>`,
    `<mask id="${id}m"><rect x="0" y="0" width="100" height="100" fill="#fff"/><circle cx="61" cy="43" r="19" fill="#000"/></mask><circle cx="50" cy="50" r="23" fill="${T.c}" mask="url(#${id}m)" style="filter:drop-shadow(0 0 6px ${T.c})"/><circle cx="40" cy="58" r="3" fill="rgba(0,0,0,.12)" mask="url(#${id}m)"/>`,
    `<g transform="rotate(-20 50 50)"><ellipse cx="50" cy="50" rx="35" ry="9" fill="none" stroke="#a7f3ea" stroke-width="3" opacity=".7"/><circle cx="50" cy="50" r="19" fill="url(#${id}g)"/><path d="M33,46 Q50,52 67,46" stroke="rgba(255,255,255,.25)" stroke-width="2" fill="none"/><path d="M15,50 A35,9 0 0,0 85,50" fill="none" stroke="#a7f3ea" stroke-width="3"/></g>`,
    `<circle cx="50" cy="50" r="22" fill="${T.c}" opacity=".25" style="filter:blur(4px)"/><g transform="translate(50 50)"><path d="M0,-27 L5,-6 L27,0 L5,6 L0,27 L-5,6 L-27,0 L-5,-6Z" fill="#fff8d6"/><path d="M0,-16 L3,-3 L16,0 L3,3 L0,16 L-3,3 L-16,0 L-3,-3Z" fill="${T.c}" transform="rotate(45)"/><circle r="7" fill="#fff"/><animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.08;1" dur="2s" repeatCount="indefinite"/></g>`,
    `<g style="filter:blur(3px)"><ellipse cx="42" cy="46" rx="22" ry="14" fill="#ff7ad9" opacity=".75"><animate attributeName="rx" values="22;26;22" dur="4s" repeatCount="indefinite"/></ellipse><ellipse cx="58" cy="54" rx="20" ry="13" fill="#7a8bff" opacity=".7"><animate attributeName="ry" values="13;17;13" dur="3.4s" repeatCount="indefinite"/></ellipse><ellipse cx="52" cy="42" rx="12" ry="9" fill="#ffd1f2" opacity=".6"/></g><circle cx="47" cy="48" r="2" fill="#fff"/><circle cx="60" cy="56" r="1.4" fill="#fff"/>`,
    `<g>${[0,180].map(r=>`<path d="M50,50 C50,38 62,32 70,40 C78,48 72,64 58,68 C44,72 30,62 30,48" fill="none" stroke="#c9b8ff" stroke-width="4" stroke-linecap="round" opacity=".85" transform="rotate(${r} 50 50)" style="filter:blur(.6px)"/>`).join("")}<circle cx="50" cy="50" r="7" fill="#fff" style="filter:drop-shadow(0 0 6px ${T.c})"/>${spin(16)}</g>`,
    `<g transform="rotate(-15 50 50)"><ellipse cx="50" cy="50" rx="36" ry="11" fill="none" stroke="${T.c}" stroke-width="7" opacity=".55" style="filter:blur(2px)"/><ellipse cx="50" cy="50" rx="34" ry="10" fill="none" stroke="#ffd29a" stroke-width="2.5" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" values="0;-26" dur="1.4s" repeatCount="indefinite"/></ellipse></g>
     <path d="M34,44 A17,17 0 0,1 66,44" fill="none" stroke="#ffb27a" stroke-width="2.5" opacity=".8"/><circle cx="50" cy="50" r="15" fill="#000" stroke="#ffe2bf" stroke-width="1.6"/>
     <g transform="rotate(-15 50 50)"><path d="M16,50 A34,10 0 0,0 84,50" fill="none" stroke="${T.c}" stroke-width="5"/></g>`,
    `<g>${Array.from({length:16},(_,i)=>`<line x1="50" y1="50" x2="${(50+36*Math.cos(i*Math.PI/8)).toFixed(1)}" y2="${(50+36*Math.sin(i*Math.PI/8)).toFixed(1)}" stroke="${["#fff","#ffd75e","#ff7ae0","#7ad8ff"][i%4]}" stroke-width="2.4" stroke-linecap="round"><animate attributeName="opacity" values=".3;1;.3" dur="${1+i%3*.4}s" repeatCount="indefinite"/></line>`).join("")}
      <circle cx="50" cy="50" r="12" fill="#fff" style="filter:drop-shadow(0 0 10px #fff)"><animate attributeName="r" values="10;14;10" dur="1.4s" repeatCount="indefinite"/></circle></g>`
  ][t];
  const art=`<defs><radialGradient id="${id}bg" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#1b2150"/><stop offset="1" stop-color="#04050d"/></radialGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T.c}"/><stop offset="1" stop-color="${T.c2}"/></linearGradient></defs>
    <circle cx="50" cy="50" r="46" fill="url(#${id}bg)" stroke="${T.c}" stroke-width="3.5"/>${dots}${objs}`;

// --- Badges emoji (Animaux, Délire salle) ---
function drawEmoji(t,T,id){
  const art=`<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.c}"/><stop offset="1" stop-color="${T.c2}"/></linearGradient></defs>
    <circle cx="50" cy="50" r="46" fill="url(#${id}g)" stroke="${T.c}" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
    <path d="M14,40 A37,37 0 0,1 86,40 C70,32 30,32 14,40Z" fill="#fff" opacity=".14"/>
    <text x="50" y="${t>=4?60:62}" text-anchor="middle" font-size="40" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${T.e}${t>=4?`<animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="1.8s" repeatCount="indefinite"/>`:""}</text>`;
  return {art,clip:CIRC,pipY:78};
}

function countUps(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const end=num(el.dataset.count), dec=el.dataset.dec==="1", t0=performance.now(), D=900;
    const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3), v=end*e; el.textContent=dec?fr1(v):fr(v); if(k<1) requestAnimationFrame(step); };
    el.textContent=dec?fr1(0):"0"; requestAnimationFrame(step);
  });
}
function confetti(n,colors){
  if(S.settings.anim==="reduced") return;

  const cols=colors||[getComputedStyle(document.documentElement).getPropertyValue("--acc").trim()||"#e5202e","#fff","#ffd75e","#5bb2ff","#3ddc84"];
  for(let i=0;i<(n||60);i++){ const c=document.createElement("i"); c.style.left=Math.random()*100+"%"; c.style.background=cols[i%cols.length]; c.style.animationDuration=(1.6+Math.random()*1.6)+"s"; c.style.animationDelay=(Math.random()*.5)+"s"; c.style.setProperty("--r",(Math.random()*1080-540)+"deg"); if(i%3===0) c.style.borderRadius="50%"; box.appendChild(c); }

}

function fanfare(t){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const base=[523,659,784,1047];
    const notes=t>=5?[...base,1319]:t>=3?base:base.slice(0,3);
    notes.forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const s=actx.currentTime+i*.09; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.16,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+(i===notes.length-1?.7:.25)); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+.8); });
  }catch(e){}
}

/* ---------- Progrès ---------- */
function viewProg(){
  return header("Progrès")+`<div class="seg" style="margin-bottom:14px">${[["exos","Exercices"],["hist","Historique"],["poids","Poids"]].map(([k,l])=>`<button class="${progSeg===k?"on":""}" onclick="progSeg='${k}';animateNext=true;render()">${l}</button>`).join("")}</div>`+(progSeg==="poids"?viewPoids():progSeg==="hist"?viewHist():viewExProg());
}
function viewExProg(){
  const ex=usedExercises();
  if(!ex.length) return `<div class="empty">Termine une séance pour voir ta progression.</div>`;
  if(!progEx||!ex.includes(progEx)) progEx=ex[0];
  const pts=[];
  [...S.sessions].reverse().forEach(s=>{ let best=0,maxkg=0,v=0; s.exercises.filter(e=>e.name===progEx).forEach(e=>e.sets.filter(x=>x.done).forEach(x=>{best=Math.max(best,e1rm(num(x.kg),num(x.reps)));maxkg=Math.max(maxkg,num(x.kg));v+=num(x.kg)*num(x.reps);})); if(best>0) pts.push({d:s.date,v:Math.round(best*10)/10,m:maxkg,vol:v}); });
  const weeks=[]; for(let w=7;w>=0;w--){ const start=Date.now()-(w+1)*7*864e5, end=Date.now()-w*7*864e5; weeks.push(S.sessions.filter(s=>s.date>start&&s.date<=end).length); }
  if(!pts.length) return `<div class="chips">${chipsEx(ex)}</div><div class="empty">Pas de charge enregistrée sur cet exo.</div>`;
  const first=pts[0], last=pts[pts.length-1], diff=Math.round((last.v-first.v)*10)/10;
  return `<div class="chips">${chipsEx(ex)}</div>
  <div class="card" style="margin-top:14px">
    <div class="row"><div class="grow"><div class="small mut">1RM estimé</div><div class="big">${fr1(last.v)} kg</div></div>${pts.length>1?`<span class="pill ${diff<0?"bad":""}">${diff>=0?"+":""}${fr1(diff)} kg</span>`:""}</div>
    ${lineChart(pts.map(p=>({x:p.d,y:p.v})),"var(--acc)")}
    <div class="grid3"><div class="macro"><b>${fr1(Math.max(...pts.map(p=>p.m)))} kg</b><span>Charge max</span></div><div class="macro"><b>${fr(last.vol)}</b><span>Volume (kg)</span></div><div class="macro"><b>${pts.length}</b><span>Séances</span></div></div>
  </div>
  <h2>Séances par semaine</h2><div class="card">${barChart(weeks)}</div>`;
}
function chipsEx(ex){ return ex.map(n=>`<button class="chip ${n===progEx?"on":""}" onclick="progEx=this.dataset.n;render()" data-n="${esc(n)}">${esc(n)}</button>`).join(""); }
function viewPoids(){
  const w=S.weights, last=w[w.length-1], first=w[0], d=last&&first?Math.round((last.kg-first.kg)*10)/10:0;
  const avg=(a,b)=>{ const x=w.filter(p=>p.date>Date.now()-a*864e5&&p.date<=Date.now()-b*864e5); return x.length?x.reduce((s,p)=>s+p.kg,0)/x.length:null; };
  const a1=avg(7,0), a2=avg(14,7);
  return `<div class="card"><div class="row"><input id="wIn" class="field grow" style="margin:0" inputmode="decimal" placeholder="Poids du jour (kg)" onkeydown="if(event.key==='Enter')addWeight()"><button class="btn sm" style="padding:12px 16px" onclick="addWeight()">Ajouter</button></div></div>
  ${w.length?`<div class="card">
    <div class="row"><div class="grow"><div class="small mut">Actuel</div><div class="big">${fr1(last.kg)} kg</div></div>${w.length>1?`<span class="pill ${d>0?"bad":""}">${d>0?"+":""}${fr1(d)} kg depuis le début</span>`:""}</div>
    ${lineChart(w.map(p=>({x:p.date,y:p.kg})),"var(--blue)")}
    ${a1&&a2?`<div class="small mut">Moyenne 7 j : <b style="color:var(--txt)">${fr1(a1)} kg</b> (${a1-a2>0?"+":""}${fr1(a1-a2)} vs semaine d'avant)</div>`:""}
  </div>
  <h2>Mesures</h2>
  <div class="card" style="padding:4px 14px">${[...w].reverse().slice(0,30).map((p,i)=>`<div class="food"><span class="grow">${fmtDate(p.date)}</span><b>${fr1(p.kg)} kg</b><button class="del" style="margin-left:8px" onclick="rmWeight(${w.length-1-i})">×</button></div>`).join("")}</div>`
  :`<div class="empty">Ajoute ta première pesée pour suivre ta courbe.<br><span class="small">Astuce : pèse-toi le matin à jeun.</span></div>`}`;
}

/* ---------- Nutrition ---------- */
function allFoods(){ return [...(S.myFoods||[]),...FOODS]; }
function foodById(id){ return allFoods().find(f=>f.id===id); }
function macroBar(lbl,v,t,col){ const pct=t?Math.min(100,v/t*100):0, over=t&&v>t*1.08; return `<div><div class="row small" style="gap:6px"><b style="color:${col}">${lbl}</b><span class="grow mut" style="text-align:right"><b style="color:var(--txt)">${fr(v)}</b> / ${fr(t)} g</span></div><div class="bar"><i style="width:${pct}%;background:${over?"var(--bad)":col}"></i></div></div>`; }
function viewNutri(){
  const c=calc(), k=nutDay, t=dayTotals(k), isToday=k===todayKey();
  const dl=isToday?"Aujourd'hui":keyToDate(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});
  const calcOpen=showCalc||!c;
  let top="";
  if(c){
    const pct=Math.min(1,t.kcal/c.target), over=t.kcal>c.target, R=56, C=2*Math.PI*R;
    top=`<div class="card"><div class="row" style="gap:16px">
      <div class="ring"><svg viewBox="0 0 132 132" width="132" height="132"><circle cx="66" cy="66" r="${R}" fill="none" style="stroke:var(--card2)" stroke-width="12"/>
        <circle class="garc" cx="66" cy="66" r="${R}" fill="none" style="stroke:${over?"var(--bad)":"var(--acc)"};--len:${C}px;transition:stroke-dashoffset .6s" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 66 66)"/></svg>
        <div class="c"><b>${fr(Math.abs(c.target-t.kcal))}</b><span>${over?"kcal en trop":"kcal restantes"}</span></div></div>
      <div class="grow" style="display:flex;flex-direction:column;gap:9px">
        ${macroBar("Protéines",t.p,c.prot,"var(--blue)")}${macroBar("Glucides",t.c,c.carbs,"var(--org)")}${macroBar("Lipides",t.f,c.fat,"var(--pink)")}
      </div></div>
      <div class="row small mut" style="margin-top:12px;justify-content:space-between"><span>Mangé <b style="color:var(--txt)">${fr(t.kcal)}</b> / ${fr(c.target)} kcal</span><span>${c.prot*4+c.carbs*4+c.fat*9>0?`P ${Math.round(c.prot*4/c.target*100)}% · G ${Math.round(c.carbs*4/c.target*100)}% · L ${Math.round(c.fat*9/c.target*100)}%`:""}</span></div></div>`;
  }
  const items=S.days[k]||[];
  const mealBlock=([m,label,ic])=>{
    const its=items.map((x,i)=>({...x,i})).filter(x=>(x.m||"snack")===m), mt=dayTotals(k,m);
    return `<div class="card" style="padding:12px 14px">
      <div class="row"><span style="font-size:20px">${ic}</span><b class="grow">${label}</b><span class="small mut">${mt.n?`${fr(mt.kcal)} kcal`:""}</span>
        <button class="btn sm" style="padding:6px 12px" onclick="openFoodPicker('${m}')">＋</button></div>
      ${its.length?`<div style="margin-top:6px">${its.map(x=>`<div class="food" style="cursor:pointer" onclick="editItem(${x.i})"><div class="grow"><div style="font-weight:700">${esc(x.n)}${x.g?` <span class="small mut" style="font-weight:600">· ${fr(x.g)} g</span>`:""}</div>
        <div class="small mut">${fr(x.k)} kcal · <span style="color:var(--blue)">P ${fr1(num(x.p))}</span> · <span style="color:var(--org)">G ${fr1(num(x.c))}</span> · <span style="color:var(--pink)">L ${fr1(num(x.f))}</span></div></div><span class="mut">›</span></div>`).join("")}
        <div class="small mut" style="margin-top:8px">P ${fr(mt.p)} g · G ${fr(mt.c)} g · L ${fr(mt.f)} g</div></div>`
      :`<div class="small mut" style="margin-top:6px">Rien pour l'instant. ${yesterdayHas(m)?`<a style="color:var(--acc);cursor:pointer;font-weight:700" onclick="copyMeal('${m}')">Copier celui de la veille</a>`:""}</div>`}
    </div>`;
  };
  return header("Nutrition")+`
  <div class="datenav"><button onclick="shiftDay(-1)">‹</button><b>${dl}</b><button onclick="shiftDay(1)" ${isToday?'disabled style="opacity:.3"':""}>›</button></div>
  ${top}
  ${!c?`<div class="card row" style="border-color:var(--acc-line)"><span style="font-size:24px">🎯</span><div class="grow small">Remplis le calculateur en bas pour avoir tes objectifs de macros.</div></div>`:""}
  ${MEALS.map(mealBlock).join("")}
  <div class="grid2" style="margin-bottom:12px"><button class="btn sec" onclick="openFoodPicker('snack')">🔎 Chercher un aliment</button><button class="btn sec" onclick="quickAddBox('snack')">⚡ Ajout rapide</button></div>
  ${c?`<h2>7 derniers jours</h2><div class="card">${kcalWeek(c.target)}</div>`:""}
  <h2 onclick="showCalc=!showCalc;render()" style="cursor:pointer">Calculateur de besoins ${c?(calcOpen?"▴":"▾"):""}</h2>
  ${calcOpen?viewCalc(c):`<div class="card row" onclick="showCalc=true;render()" style="cursor:pointer"><div class="grow small mut">Objectif : <b style="color:var(--txt)">${(GOALS.find(g=>g.k===S.profile.goal)||GOALS[1]).l}</b> · ${fr(c.target)} kcal · P ${c.prot} / G ${c.carbs} / L ${c.fat}${S.profile.validated?` <span style="color:#3ddc84">· ✓ validé</span>`:""}</div><span>›</span></div>`}`;
}
function yesterdayHas(m){ const d=keyToDate(nutDay); d.setDate(d.getDate()-1); return (S.days[todayKey(d)]||[]).some(x=>(x.m||"snack")===m); }
function copyMeal(m){ const d=keyToDate(nutDay); d.setDate(d.getDate()-1); const src=(S.days[todayKey(d)]||[]).filter(x=>(x.m||"snack")===m); (S.days[nutDay]=S.days[nutDay]||[]).push(...src.map(x=>({...x,id:uid()}))); saveDay(nutDay); haptic(); toast("Repas copié ✓"); render(); }

/* --- Sélecteur d'aliments --- */
let pickMeal="snack", pickTab="recents";
function openFoodPicker(m){ pickMeal=m; pickTab=(S.foods||[]).some(x=>x.id&&foodById(x.id))?"recents":"tout"; modal(`<h3>${MEALS.find(x=>x[0]===m)[2]} Ajouter · ${MEALS.find(x=>x[0]===m)[1]}</h3>
  <input class="field" id="fSearch" placeholder="Rechercher (poulet, riz, skyr…)" oninput="renderFoodList()">
  <div class="seg" style="margin-bottom:10px">${[["recents","Récents"],["mine","Mes aliments"],["tout","Tout"]].map(([k,l])=>`<button id="pt-${k}" class="${pickTab===k?"on":""}" onclick="pickTab='${k}';document.querySelectorAll('[id^=pt-]').forEach(b=>b.classList.toggle('on',b.id==='pt-${k}'));renderFoodList()">${l}</button>`).join("")}</div>
  <div class="grid2" style="margin-bottom:6px"><button class="btn sec sm" style="width:100%" onclick="createFoodBox()">＋ Créer un aliment</button><button class="btn sec sm" style="width:100%" onclick="quickAddBox('${m}')">⚡ Ajout rapide</button></div>
  <div id="fList"></div>`); renderFoodList(); }
function renderFoodList(){
  const q=($("#fSearch")?.value||"").trim().toLowerCase(), qn=slug(q);
  let list;
  if(q) list=allFoods().filter(f=>slug(f.n).includes(qn));
  else if(pickTab==="recents") list=(S.foods||[]).map(r=>foodById(r.id)).filter(Boolean);
  else if(pickTab==="mine") list=S.myFoods||[];
  else list=FOODS;
  const row=f=>`<button class="food" style="width:100%;text-align:left" onclick="openQty('${f.id}')"><div class="grow"><div style="font-weight:700">${esc(f.n)}</div><div class="small mut">${fr(f.k)} kcal · P ${fr1(f.p)} · G ${fr1(f.c)} · L ${fr1(f.f)} <span style="opacity:.7">/ 100 g</span></div></div><span style="color:var(--acc);font-size:22px;font-weight:800">＋</span></button>`;
  let html="";
  if(!q&&pickTab==="tout"){ const g={}; list.forEach(f=>(g[f.cat]=g[f.cat]||[]).push(f)); html=Object.entries(g).map(([c,l])=>`<h2>${c}</h2>`+l.map(row).join("")).join(""); }
  else html=list.map(row).join("");
  if(!list.length) html=`<div class="empty small">${q?`Aucun résultat pour « ${esc(q)} ».<br><a style="color:var(--acc);font-weight:700;cursor:pointer" onclick="createFoodBox(${JSON.stringify(q).replace(/"/g,"&quot;")})">＋ Créer « ${esc(q)} »</a>`:pickTab==="mine"?"Tu n'as pas encore créé d'aliment.":"Pas encore d'aliment récent."}</div>`;
  $("#fList").innerHTML=html;
}
let qtyCtx=null;
function openQty(fid,editIndex){
  const f=foodById(fid); if(!f) return;
  const it=editIndex!=null?S.days[nutDay][editIndex]:null;
  qtyCtx={f,edit:editIndex,m:it?(it.m||"snack"):pickMeal,g:it?num(it.g):f.por};
  modal(`<h3>${esc(f.n)}</h3><div class="small mut" style="margin:-6px 0 12px">${fr(f.k)} kcal · P ${fr1(f.p)} · G ${fr1(f.c)} · L ${fr1(f.f)} pour 100 g</div>
    <label class="l">Quantité (g)</label>
    <div class="row"><button class="back" onclick="qtyStep(-10)">−</button><input id="qG" class="field" style="margin:0;text-align:center;font-size:22px;font-weight:800" inputmode="decimal" value="${qtyCtx.g}" oninput="qtyCtx.g=num(this.value);qtyLive()"><button class="back" onclick="qtyStep(10)">＋</button></div>
    <div class="chips" style="margin:10px 0 14px">${[[f.por,`${f.pl||"1 portion"} (${f.por} g)`],[f.por/2,"½ portion"],[f.por*2,"×2"],[50,"50 g"],[100,"100 g"],[150,"150 g"],[200,"200 g"]].map(([v,l])=>`<button class="chip" onclick="qtySet(${v})">${l}</button>`).join("")}</div>
    <div id="qLive"></div>
    <label class="l" style="margin-top:12px">Repas</label>
    <div class="seg" style="margin-bottom:14px">${MEALS.map(([k,l,ic])=>`<button id="qm-${k}" class="${qtyCtx.m===k?"on":""}" onclick="qtyCtx.m='${k}';document.querySelectorAll('[id^=qm-]').forEach(b=>b.classList.toggle('on',b.id==='qm-${k}'))">${ic}</button>`).join("")}</div>
    ${it?`<div class="grid2"><button class="btn danger" onclick="rmFood(${editIndex})">Supprimer</button><button class="btn" onclick="qtySave()">Enregistrer</button></div>`:`<button class="btn" onclick="qtySave()">Ajouter</button>`}`);
  qtyLive();
}
function qtyMacros(){ const f=qtyCtx.f, r=qtyCtx.g/100; return {k:f.k*r,p:f.p*r,c:f.c*r,f:f.f*r}; }
function qtyLive(){ const m=qtyMacros(); const el=$("#qLive"); if(!el) return;
  el.innerHTML=`<div class="macro" style="background:var(--acc-soft);border:1px solid var(--acc-line);text-align:center"><b style="font-size:26px;color:var(--acc)">${fr(m.k)} kcal</b></div>
  <div class="grid3" style="margin-top:8px"><div class="macro"><b style="color:var(--blue)">${fr1(m.p)} g</b><span>Protéines</span></div><div class="macro"><b style="color:var(--org)">${fr1(m.c)} g</b><span>Glucides</span></div><div class="macro"><b style="color:var(--pink)">${fr1(m.f)} g</b><span>Lipides</span></div></div>`; }
function qtySet(v){ qtyCtx.g=Math.round(v); $("#qG").value=qtyCtx.g; qtyLive(); haptic(8); }
function qtyStep(d){ qtySet(Math.max(0,qtyCtx.g+d)); }
function qtySave(){
  if(qtyCtx.g<=0){ toast("Indique une quantité"); return; }
  const m=qtyMacros(), f=qtyCtx.f, r=x=>Math.round(x*10)/10;
  const item={id:uid(),fid:f.id,n:f.n,g:Math.round(qtyCtx.g),k:Math.round(m.k),p:r(m.p),c:r(m.c),f:r(m.f),m:qtyCtx.m};
  const day=(S.days[nutDay]=S.days[nutDay]||[]);
  if(qtyCtx.edit!=null) day[qtyCtx.edit]=item; else day.push(item);
  S.foods=[{id:f.id},...(S.foods||[]).filter(x=>x.id&&x.id!==f.id)].slice(0,25);
  saveDay(nutDay); saveMeta(); closeModal(); haptic(); render();
  toast(qtyCtx.edit!=null?"Modifié ✓":`+ ${item.k} kcal · ${f.n}`);
}
function editItem(i){ const it=S.days[nutDay][i]; if(it.fid&&foodById(it.fid)) openQty(it.fid,i); else quickAddBox(it.m||"snack",i); }
function quickAddBox(m,editIndex){
  const it=editIndex!=null?S.days[nutDay][editIndex]:{n:"",k:"",p:"",c:"",f:""};
  modal(`<h3>⚡ Ajout rapide</h3><div class="small mut" style="margin:-6px 0 12px">Pour un plat sans étiquette, ou quand tu connais déjà les valeurs.</div>
    <label class="l">Nom</label><input id="qaN" class="field" value="${esc(it.n)}" placeholder="ex. Plat du resto">
    <div class="grid2"><div><label class="l">kcal</label><input id="qaK" class="field" inputmode="numeric" value="${esc(it.k)}"></div><div><label class="l">Protéines (g)</label><input id="qaP" class="field" inputmode="decimal" value="${esc(it.p)}"></div>
    <div><label class="l">Glucides (g)</label><input id="qaC" class="field" inputmode="decimal" value="${esc(it.c??"")}"></div><div><label class="l">Lipides (g)</label><input id="qaF" class="field" inputmode="decimal" value="${esc(it.f??"")}"></div></div>
    <div class="small mut" id="qaHint" style="margin:-2px 0 12px">Astuce : laisse les kcal vides, elles seront calculées depuis les macros.</div>
    ${editIndex!=null?`<div class="grid2"><button class="btn danger" onclick="rmFood(${editIndex})">Supprimer</button><button class="btn" onclick="quickAddSave('${m}',${editIndex})">Enregistrer</button></div>`:`<button class="btn" onclick="quickAddSave('${m}')">Ajouter</button>`}`);
}
function quickAddSave(m,editIndex){
  const p=num($("#qaP").value), c=num($("#qaC").value), f=num($("#qaF").value);
  let k=num($("#qaK").value); if(k<=0) k=Math.round(p*4+c*4+f*9);
  if(k<=0){ toast("Indique des kcal ou des macros"); return; }
  const item={id:uid(),n:$("#qaN").value.trim()||"Repas",k:Math.round(k),p,c,f,m};
  const day=(S.days[nutDay]=S.days[nutDay]||[]); if(editIndex!=null) day[editIndex]=item; else day.push(item);
  saveDay(nutDay); closeModal(); haptic(); render(); toast("+ "+item.k+" kcal");
}
function createFoodBox(name){
  modal(`<h3>＋ Créer un aliment</h3><div class="small mut" style="margin:-6px 0 12px">Recopie les valeurs <b>pour 100 g</b> de l'étiquette.</div>
    <label class="l">Nom</label><input id="cfN" class="field" value="${esc(name||"")}" placeholder="ex. Céréales protéinées">
    <div class="grid2"><div><label class="l">kcal / 100 g</label><input id="cfK" class="field" inputmode="numeric"></div><div><label class="l">Protéines / 100 g</label><input id="cfP" class="field" inputmode="decimal"></div>
    <div><label class="l">Glucides / 100 g</label><input id="cfC" class="field" inputmode="decimal"></div><div><label class="l">Lipides / 100 g</label><input id="cfF" class="field" inputmode="decimal"></div></div>
    <div class="grid2"><div><label class="l">Portion (g)</label><input id="cfG" class="field" inputmode="numeric" value="100"></div><div><label class="l">Nom de la portion</label><input id="cfL" class="field" placeholder="ex. 1 bol"></div></div>
    <button class="btn" onclick="createFoodSave()">Créer et ajouter</button>`);
}
function createFoodSave(){
  const n=$("#cfN").value.trim(); if(!n){ toast("Donne un nom"); return; }
  const p=num($("#cfP").value), c=num($("#cfC").value), f=num($("#cfF").value); let k=num($("#cfK").value); if(k<=0) k=Math.round(p*4+c*4+f*9);
  const food={id:"u-"+uid(),n:n.slice(0,50),cat:"Mes aliments",k,p,c,f,por:Math.max(1,num($("#cfG").value)||100),pl:$("#cfL").value.trim()||"1 portion"};
  (S.myFoods=S.myFoods||[]).unshift(food); saveMeta(); openQty(food.id);
}
function viewCalc(c){
  const p=S.profile, w=curWeight();
  return `<div class="card">
    <div class="seg" style="margin-bottom:12px">${[["H","Homme"],["F","Femme"]].map(([k,l])=>`<button class="${p.sexe===k?"on":""}" onclick="showCalc=true;setProf('sexe','${k}')">${l}</button>`).join("")}</div>
    <div class="grid3">
      <div><label class="l">Âge</label><input class="field" inputmode="numeric" value="${esc(p.age)}" placeholder="ans" oninput="calcInput('age',this.value)"></div>
      <div><label class="l">Taille (cm)</label><input class="field" inputmode="numeric" value="${esc(p.taille)}" placeholder="cm" oninput="calcInput('taille',this.value)"></div>
      <div><label class="l">Poids (kg)</label><input class="field" inputmode="decimal" value="${w??""}" placeholder="kg" oninput="calcInput('poids',this.value)" onchange="calcDone()"></div>
    </div>
    <label class="l">Activité</label>
    <select class="field" onchange="showCalc=true;setProf('act',parseFloat(this.value))">${ACT.map(a=>`<option value="${a.k}" ${num(p.act)===a.k?"selected":""}>${a.l} — ${a.d}</option>`).join("")}</select>
    <label class="l">Objectif</label>
    <div class="seg">${GOALS.map(g=>`<button class="${p.goal===g.k?"on":""}" onclick="showCalc=true;setProf('goal','${g.k}')">${g.l}</button>`).join("")}</div>
    <div class="small mut" style="margin-top:6px">${(GOALS.find(g=>g.k===p.goal)||GOALS[1]).t}</div>
    <button class="btn" style="margin-top:14px" onclick="validateCalc()">✅ Valider et voir mes macros</button>
    ${p.validated?`<div class="small" style="color:#3ddc84;text-align:center;margin-top:6px">✓ Infos validées le ${new Date(p.validated).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</div>`:""}
    <div id="calcRes">${calcResults(c)}</div>
    <h2 style="margin-top:18px">Réglage fin des macros</h2>

function kcalWeek(target){
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=todayKey(d); days.push({k,v:dayTotals(k).kcal,l:d.toLocaleDateString("fr-FR",{weekday:"narrow"})}); }
  const W=340,H=130,mx=Math.max(target*1.25,...days.map(d=>d.v)),bw=(W-20)/7,Y=v=>H-20-v/mx*(H-34);
  const f=days.filter(d=>d.v>0), a=f.length?f.reduce((s,d)=>s+d.v,0)/f.length:0;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">
    ${days.map((d,i)=>`<rect x="${10+i*bw+7}" y="${Y(d.v)}" width="${bw-14}" height="${Math.max(H-20-Y(d.v),2)}" rx="5" style="fill:${d.v>target*1.05?"var(--bad)":d.k===nutDay?"var(--acc)":"var(--line)"}"/><text x="${10+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${d.l}</text>`).join("")}
    <line x1="10" x2="${W-10}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--acc)" stroke-dasharray="4 4" opacity=".7"/>

  </svg>${a?`<div class="small mut">Moyenne des jours notés : <b style="color:var(--txt)">${fr(a)} kcal</b></div>`:""}`;
}

    S.settings.bgType="image"; S.settings.qtheme=null; bgKey=""; applyTheme(); saveMeta(); render(); toast("📷 Fond appliqué"); };

  let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const X=x=>p.l+(x-x0)/((x1-x0)||1)*(W-p.l-p.r), Y=y=>p.t+(1-(y-mn)/(mx-mn))*(H-p.t-p.b);
  const d=pts.map((q,i)=>(i?"L":"M")+X(q.x).toFixed(1)+","+Y(q.y).toFixed(1)).join(""), area=d+`L${X(x1)},${H-p.b}L${X(x0)},${H-p.b}Z`;
  const ticks=[mn+(mx-mn)*.15,(mn+mx)/2,mx-(mx-mn)*.15], gid="lg"+(++chartN);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="margin:10px 0">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col};stop-opacity:.3"/><stop offset="1" style="stop-color:${col};stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(t=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line)"/><text x="${p.l-6}" y="${Y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    <path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" style="stroke:${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length<=30?pts.map(q=>`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="3" style="fill:var(--bg);stroke:${col}" stroke-width="2"/>`).join(""):""}
    <text x="${p.l}" y="${H-5}">${new Date(x0).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>
    <text x="${W-p.r}" y="${H-5}" text-anchor="end">${new Date(x1).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</text>
  </svg>`;
}
function barChart(v){
  const W=340,H=110,mx=Math.max(4,...v),bw=(W-20)/v.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${v.map((n,i)=>{const h=n/mx*(H-30);return `<rect x="${10+i*bw+6}" y="${H-18-h}" width="${bw-12}" height="${Math.max(h,2)}" rx="5" style="fill:${i===v.length-1?"var(--acc)":"var(--line)"}"/><text x="${10+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${i===v.length-1?"cette sem.":"S-"+(v.length-1-i)}</text>${n?`<text x="${10+i*bw+bw/2}" y="${H-22-h}" text-anchor="middle" style="fill:var(--txt);font-weight:700">${n}</text>`:""}`}).join("")}</svg>`;

/* ================= Timer de repos ================= */
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.15);}); }catch(e){} haptic([200,100,200]); }
function startTimer(sec){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){} timer.end=Date.now()+sec*1000; timer.total=sec*1000; clearInterval(timer.id); timer.id=setInterval(tick,250); renderTimer(); }
function addTime(s){ timer.end+=s*1000; timer.total=Math.max(timer.total||0,timer.end-Date.now()); if(timer.end<=Date.now()) stopTimer(); else renderTimer(); }
function stopTimer(){ clearInterval(timer.id); timer.end=0; renderTimer(); }
function tick(){ if(Date.now()>=timer.end){ beep(); const el=$("#timer"); if(el){ el.classList.add("end"); } setTimeout(stopTimer,500); clearInterval(timer.id); toast("⏱ Repos terminé, série suivante !"); } else renderTimer(); }
function renderTimer(){
  let el=$("#timer");
  if(!timer.end||!S.current){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="timer"; el.className="timer"; document.body.appendChild(el); }
  const r=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  el.style.setProperty("--tp",Math.max(0,Math.min(100,(timer.end-Date.now())/(timer.total||1)*100))+"%");
  el.innerHTML=`⏱ ${Math.floor(r/60)}:${String(r%60).padStart(2,"0")} <button onclick="addTime(-15)">−15</button><button onclick="addTime(15)">+15</button><button onclick="stopTimer()">✕</button>`;
}

const CFG=(window.SUIVI_CFG&&window.SUIVI_CFG.url&&window.SUIVI_CFG.key&&!/XXXX/.test(window.SUIVI_CFG.url))?window.SUIVI_CFG:null;
let sb=null, sbUser=null, sbProfile=null, authMode="signup", statsT=null;
function sbAdapter(fn){ return ()=>({set:async v=>{ const {error}=await fn(v); if(error) throw error; }}); }
async function loadSupabaseLib(){
  if(window.supabase&&window.supabase.createClient) return;
  await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });

async function initSupabase(){
  try{ await loadSupabaseLib(); }catch(e){ setSync(false,"Hors ligne"); return; }

  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="PASSWORD_RECOVERY") newPasswordBox(); });
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){ setSync(false,"Non connecté"); if(!S.settings.offline){ tab="auth"; animateNext=true; render(); } return; }
  await afterLogin(data.session.user);
